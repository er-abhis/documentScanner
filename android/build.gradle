buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26 // react-native-vision-camera requires 26+
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // react-native-vision-camera reads this via rootProject.ext (NOT
        // gradle.properties) to decide whether to BUNDLE the ML Kit barcode
        // model. Without it here the scanner falls back to an on-demand model
        // that may never download → camera opens but never detects a QR.
        VisionCamera_enableCodeScanner = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 8 requires every Android library to declare a `namespace`. A few older
// autolinked deps (e.g. react-native-print) still rely on the legacy manifest
// `package=` attribute, which AGP 8 rejects. Backfill the namespace from their
// manifest so they build without patching node_modules.
subprojects { sp ->
    sp.plugins.withId("com.android.library") {
        def androidExt = sp.extensions.findByName("android")
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = new File(sp.projectDir, "src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def m = (manifestFile.text =~ /package="([^"]+)"/)
                if (m) {
                    androidExt.namespace = m[0][1]
                }
            }
        }

        // react-native-print hard-codes compileSdk 31 / buildTools 31.0.0,
        // which RN 0.87 rejects via the AAR metadata check. Force it onto the
        // project-wide versions via finalizeDsl (the last hook before AGP
        // reads/locks the DSL). Scoped to this module so nothing else changes.
        if (sp.name == "react-native-print") {
            def androidComponents = sp.extensions.findByName("androidComponents")
            if (androidComponents != null) {
                androidComponents.finalizeDsl { dsl ->
                    dsl.compileSdk = rootProject.ext.compileSdkVersion
                    dsl.buildToolsVersion = rootProject.ext.buildToolsVersion
                }
            }
        }
    }
}
